[build-system]
requires = [
    "scikit-build-core>=0.10",
    "pybind11>=2.13",
]
build-backend = "scikit_build_core.build"

[project]
name = "flash-join"
version = "0.2.0"
description = "Adaptive perfect and CedarDB-style unchained joins for NumPy"
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [
    { name = "Jinming Hu", email = "conanhujinming@gmail.com" },
]
dependencies = [
    "numpy>=1.23",
]

[project.optional-dependencies]
benchmark = [
    "duckdb>=1.3",
    "matplotlib>=3.8",
    "pandas>=2.0",
]
test = [
    "pytest>=8.0",
]

[tool.scikit-build]
cmake.build-type = "Release"
cmake.version = ">=3.20"
wheel.packages = []

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
